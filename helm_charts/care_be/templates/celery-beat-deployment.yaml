{{- if .Values.celeryBeat.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "care-be.fullname" . }}-celery-beat
  labels:
    {{- include "care-be.labels" . | nindent 4 }}
    app.kubernetes.io/component: celery-beat
spec:
  strategy:
    {{- toYaml (.Values.celeryBeat.strategy | default (dict "type" "RollingUpdate")) | nindent 4 }}
  replicas: {{ .Values.celeryBeat.replicaCount }}
  selector:
    matchLabels:
      {{- include "care-be.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: celery-beat
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.celeryBeat.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "care-be.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: celery-beat
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "care-be.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}-celery-beat
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "care-be.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.celeryBeat.command }}
          command:
            {{- toYaml .Values.celeryBeat.command | nindent 12 }}
          {{- end }}
          {{- with include "care-be.envBlocks" . | trim }}{{ . | nindent 10 }}{{ end }}
          resources:
            {{- toYaml .Values.celeryBeat.resources | nindent 12 }}
          volumeMounts:
            - name: production-logging
              mountPath: /app/config/settings/production_logging.py
              subPath: production_logging.py
              readOnly: true
          {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: production-logging
          configMap:
            name: {{ include "care-be.fullname" . }}-production-logging
      {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
