{{- if .Values.celeryFlower.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "care-be.fullname" . }}-celery-flower
  labels:
    {{- include "care-be.labels" . | nindent 4 }}
    app.kubernetes.io/component: celery-flower
spec:
  strategy:
    {{- toYaml (.Values.celeryFlower.strategy | default (dict "type" "RollingUpdate")) | nindent 4 }}
  # Flower holds task/event history in process memory. More than one replica
  # behind the Service returns a different partial view per request, so this is
  # intentionally not configurable.
  replicas: 1
  selector:
    matchLabels:
      {{- include "care-be.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: celery-flower
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.celeryFlower.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "care-be.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: celery-flower
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "care-be.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}-celery-flower
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- if .Values.registry.enabled }}
          {{- $registryHost := .Values.registry.host }}
          {{- $registryPort := .Values.registry.port }}
          {{- $imageRepo := .Values.image.repository }}
          {{- $imageTag := .Values.image.tag | default .Chart.AppVersion }}
          {{- if $registryPort }}
          image: "{{ $registryHost }}:{{ $registryPort }}/{{ $imageRepo }}:{{ $imageTag }}"
          {{- else }}
          image: "{{ $registryHost }}/{{ $imageRepo }}:{{ $imageTag }}"
          {{- end }}
          {{- else }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          {{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.celeryFlower.command }}
          command:
            {{- toYaml .Values.celeryFlower.command | nindent 12 }}
          {{- end }}
          ports:
            - name: flower
              containerPort: {{ .Values.celeryFlower.service.targetPort }}
              protocol: TCP
          {{- if or .Values.env .Values.envFromSecretKey }}
          env:
            {{- range .Values.env }}
            - name: {{ .name }}
              {{- if .valueFrom }}
              valueFrom:
                {{- if .valueFrom.secretKeyRef }}
                secretKeyRef:
                  name: {{ .valueFrom.secretKeyRef.name }}
                  key: {{ .valueFrom.secretKeyRef.key }}
                {{- end }}
                {{- if .valueFrom.configMapKeyRef }}
                configMapKeyRef:
                  name: {{ .valueFrom.configMapKeyRef.name }}
                  key: {{ .valueFrom.configMapKeyRef.key }}
                {{- end }}
              {{- else }}
              value: {{ .value | quote }}
              {{- end }}
            {{- end }}
            {{- range .Values.envFromSecretKey }}
            - name: {{ .name }}
              valueFrom:
                secretKeyRef:
                  name: {{ .secretName }}
                  key: {{ .key }}
            {{- end }}
          {{- end }}
          {{- if or .Values.envFromConfigMap .Values.envFromSecret (and .Values.configMap.enabled .Values.configMap.data) (and .Values.secret.enabled .Values.secret.data) }}
          envFrom:
            {{- range .Values.envFromConfigMap }}
            - configMapRef:
                name: {{ .name }}
                {{- if .prefix }}
                prefix: {{ .prefix }}
                {{- end }}
            {{- end }}
            {{- range .Values.envFromSecret }}
            - secretRef:
                name: {{ .name }}
                {{- if .prefix }}
                prefix: {{ .prefix }}
                {{- end }}
            {{- end }}
            {{- if and .Values.configMap.enabled .Values.configMap.data }}
            - configMapRef:
                name: {{ include "care-be.fullname" . }}-config
            {{- end }}
            {{- if and .Values.secret.enabled .Values.secret.data }}
            - secretRef:
                name: {{ include "care-be.fullname" . }}-secret
            {{- end }}
          {{- end }}
          {{- if .Values.celeryFlower.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.celeryFlower.livenessProbe.httpGet.path | quote }}
              port: {{ .Values.celeryFlower.livenessProbe.httpGet.port | quote }}
            initialDelaySeconds: {{ .Values.celeryFlower.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.celeryFlower.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.celeryFlower.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.celeryFlower.livenessProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.celeryFlower.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.celeryFlower.readinessProbe.httpGet.path | quote }}
              port: {{ .Values.celeryFlower.readinessProbe.httpGet.port | quote }}
            initialDelaySeconds: {{ .Values.celeryFlower.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.celeryFlower.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.celeryFlower.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.celeryFlower.readinessProbe.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.celeryFlower.resources | nindent 12 }}
          volumeMounts:
            - name: production-logging
              mountPath: /app/config/settings/production_logging.py
              subPath: production_logging.py
              readOnly: true
          {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: production-logging
          configMap:
            name: {{ include "care-be.fullname" . }}-production-logging
      {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
