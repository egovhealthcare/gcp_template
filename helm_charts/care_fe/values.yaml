# Default values for care-fe
# Cloud provider (gcp, aws, azure, etc.)
global:
  cloudProvider: null
  backendPolicy:
    enabled: false
    securityPolicy: ""
  httpRoute:
    enabled: false
  gateway:
    name: ""

replicaCount: 2

# Container registry configuration (Zot)
registry:
  enabled: false
  host: "zot"
  port: "5000"  # Leave empty for default port, or specify port number

image:
  repository: ghcr.io/ohcnetwork/care_fe  # Image name in the registry
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
  # If Zot registry requires authentication, add secret name here:
  # - name: zot-registry-secret

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 80
  targetPort: 80
  annotations: {}

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Health check configuration
livenessProbe:
  enabled: false
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  enabled: false
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# Enabled only when using GCP and Cloud Armor for backend security
backendPolicy:
  enabled: "{{ .Values.global.backendPolicy.enabled }}"
  # Name of the Cloud Armor regional security policy (must exist)
  securityPolicy: "{{ .Values.global.backendPolicy.securityPolicy }}"
  timeoutSec: 60
  drainingTimeoutSec: 60
  healthCheck:
    checkIntervalSec: 10
    timeoutSec: 5
    healthyThreshold: 1
    unhealthyThreshold: 3
    port: 80
    path: /

httpRoute:
  enabled: "{{ .Values.global.httpRoute.enabled }}"
  # Name of the Gateway resource to attach to
  gatewayName: "{{ .Values.global.gateway.name }}"
  annotations: {}
  hostnames: []
  # Security headers set at the Gateway via an HTTPRoute ResponseHeaderModifier.
  # Values are templated (tpl), so hostnames can reference .Values. Set a header to
  # "" (or null) to drop it from the filter; list names under `remove` to strip
  # headers emitted by the backend (e.g. the Report-Only CSP baked into the image).
  responseHeaders:
    set:
      Content-Security-Policy: >-
        default-src 'self' https: data: blob:;
        script-src 'self' 'unsafe-inline' 'unsafe-eval' https://*.pages.dev https://*.github.io https://*.ohc.network https://*.10bedicu.in https://*.10bedicu.org https://www.google.com https://www.gstatic.com https://www.recaptcha.net;
        style-src 'self' 'unsafe-inline' https://*.pages.dev https://*.github.io https://*.ohc.network https://*.10bedicu.in https://*.10bedicu.org;
        img-src 'self' data: blob: https:;
        connect-src 'self' https: wss:;
        font-src 'self' data: https:;
        worker-src 'self' blob: https://*.pages.dev https://*.github.io https://*.ohc.network https://*.10bedicu.in https://*.10bedicu.org;
        frame-src 'self' https:;
        object-src 'self' blob: https:;
        frame-ancestors 'self';
        base-uri 'self';
        form-action 'self' https:;
        upgrade-insecure-requests
      Cross-Origin-Opener-Policy: same-origin-allow-popups
      Cross-Origin-Resource-Policy: same-site
      Cross-Origin-Embedder-Policy: unsafe-none
    remove:
      - Content-Security-Policy-Report-Only
