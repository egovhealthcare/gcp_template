{{- if .Values.httpRedirect.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Values.httpRedirect.name }}
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ include "gateway.gatewayName" . }}
      sectionName: {{ .Values.gateway.httpListener.name }}
  rules:
{{- if .Values.httpRedirect.acmeExemption.enabled }}
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.httpRedirect.acmeExemption.path | quote }}
{{- end }}
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: {{ .Values.httpRedirect.scheme }}
            statusCode: {{ .Values.httpRedirect.statusCode }}
{{- end }}
