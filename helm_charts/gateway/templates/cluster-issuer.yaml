{{- if .Values.certmanager.enabled }}
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Values.certmanager.clusterIssuer.name }}
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
spec:
  acme:
    server: {{ .Values.certmanager.clusterIssuer.server }}
    privateKeySecretRef:
      name: {{ .Values.certmanager.clusterIssuer.privateKeySecretName }}
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - name: {{ include "gateway.gatewayName" . }}
                namespace: {{ .Values.global.namespace | default .Release.Namespace }}
                sectionName: {{ .Values.certmanager.clusterIssuer.solver.httpSectionName }}
{{- end }}
