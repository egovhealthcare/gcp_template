{{- if and .Values.certmanager.enabled .Values.certmanager.certificate.dnsNames }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.certmanager.certificate.name }}
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
spec:
  secretName: {{ .Values.certmanager.certificate.secretName }}
  issuerRef:
    name: {{ .Values.certmanager.clusterIssuer.name }}
    kind: ClusterIssuer
  dnsNames:
    {{- range .Values.certmanager.certificate.dnsNames }}
    - {{ . | quote }}
    {{- end }}
{{- end }}
