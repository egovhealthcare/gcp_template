{{- if and (eq .Values.global.cloudProvider "gcp") .Values.gateway.gatewayPolicy.enabled }}
---
apiVersion: networking.gke.io/v1
kind: GCPGatewayPolicy
metadata:
  name: {{ include "gateway.gatewayName" . }}-policy
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
spec:
  default:
    {{- /* Cloud Armor attaches via GCPBackendPolicy (per-Service), NOT here.
           GCPGatewayPolicy v1 spec.default accepts only:
           allowGlobalAccess, region, sslPolicy.
           Setting securityPolicy here is silently dropped by the API server. */}}
    {{- if .Values.gateway.gatewayPolicy.sslPolicy }}
    sslPolicy: {{ .Values.gateway.gatewayPolicy.sslPolicy }}
    {{- end }}
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: {{ include "gateway.gatewayName" . }}
{{- end }}
