apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dcm4chee.fullname" . }}-nginx-config
  labels:
    {{- include "dcm4chee.labels" . | nindent 4 }}
data:
  default.conf.template: |
    server {
      gzip_static  always;
      gzip_proxied expired no-cache no-store private auth;
      gunzip       on;
      listen 80 default_server;
      listen [::]:80 default_server;
      client_max_body_size {{ .Values.nginx.clientMaxBodySize }};

      # OHIF Viewer
      location / {
        if ($request_method = OPTIONS) {
          return 204;
        }
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
        add_header Cross-Origin-Resource-Policy same-origin;
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' '*' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
      }

      # DCM4CHE Server
      location /dicomweb/ {
        if ($request_method = OPTIONS) {
          return 204;
        }
        auth_request /authenticate;
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' '*' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        proxy_set_header Authorization "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        rewrite /dicomweb(.*) $1 break;
        proxy_pass http://{{ include "dcm4chee.fullname" . }}-arc.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.arc.service.port }};
      }

      # Authentication Endpoint
      location = /authenticate {
        internal;
        proxy_pass {{ .Values.nginx.authBackendUrl }};
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header Acc $remote_addr;
        proxy_set_header Accept application/json;
      }

      error_page   500 502 503 504  /50x.html;
      location = /50x.html {
        root   /usr/share/nginx/html;
      }
    }
