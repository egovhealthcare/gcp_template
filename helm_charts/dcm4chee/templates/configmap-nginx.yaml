apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dcm4chee.fullname" . }}-nginx-config
  labels:
    {{- include "dcm4chee.labels" . | nindent 4 }}
data:
  # Mounted into the OHIF container over /usr/src/default.conf.template. The
  # ohif/app and radiology-ohif entrypoints render that file into
  # /etc/nginx/conf.d/default.conf on start (envsubst on $PORT/$PUBLIC_URL,
  # neither used here). The static app block mirrors the image default; diff
  # it when bumping ohif.image.tag.
  # add_header is set per location because a location with any add_header
  # does not inherit server-level ones.
  default.conf.template: |
    server {
      gzip_static  always;
      gzip_proxied expired no-cache no-store private auth;
      gunzip       on;
      listen 80 default_server;
      listen [::]:80 default_server;
      client_max_body_size {{ .Values.nginx.clientMaxBodySize }};

      # OHIF Viewer (static)
      location / {
        if ($request_method = OPTIONS) {
          return 204;
        }
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
        add_header Cross-Origin-Resource-Policy same-origin;
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' '*' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
      }

      # DCM4CHEE Arc, gated by CARE JWT validation
      location /dicomweb/ {
        if ($request_method = OPTIONS) {
          return 204;
        }
        auth_request /authenticate;
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' '*' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        proxy_set_header Authorization "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        rewrite /dicomweb(.*) $1 break;
        proxy_pass http://{{ include "dcm4chee.fullname" . }}-arc.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.arc.service.port }};
      }

      # CARE authentication subrequest
      location = /authenticate {
        internal;
        proxy_pass {{ .Values.nginx.authBackendUrl }};
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header Acc $remote_addr;
        proxy_set_header Accept application/json;
      }

      error_page   500 502 503 504  /50x.html;
      location = /50x.html {
        root   /usr/share/nginx/html;
      }
    }
